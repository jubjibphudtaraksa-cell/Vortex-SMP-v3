name: Build VortexScoreboard
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o VortexScoreboard-source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: vortex-scoreboard/pom.xml
      - run: mvn --batch-mode clean package
        working-directory: vortex-scoreboard
      - uses: actions/upload-artifact@v4
        with:
          name: VortexScoreboard
          path: vortex-scoreboard/target/VortexScoreboard.jar
